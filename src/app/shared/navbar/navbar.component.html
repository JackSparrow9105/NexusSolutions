<nav class="navbar" [class.scrolled]="isScrolled">

  <!-- Logo always col 1 -->
  <a routerLink="/" class="logo" (click)="closeMenu()">
    <img src="assets/nexus-logo.png" alt="Nexus Solutions – Powering Progress, Protecting Lives" width="180" height="48" class="logo-image">
  </a>

  <!-- Center nav links (desktop) / slide-down menu (mobile) -->
  <ul class="nav-links" [class.active]="menuOpen" id="main-menu">
    <li><a routerLink="/" (click)="closeMenu()">Home</a></li>

    <li class="dropdown"
        (mouseenter)="openDropdown('company')"
        (mouseleave)="closeDropdown()">
      <button type="button" class="dropdown-toggle"
              [attr.aria-expanded]="activeDropdown === 'company'"
              (click)="toggleDropdown('company', $event)">
        Company <small [class.rotate]="activeDropdown === 'company'">▾</small>
      </button>
      <ul class="dropdown-menu" *ngIf="activeDropdown === 'company'">
        <li><a routerLink="/" fragment="about" (click)="closeMenu()">About Us</a></li>
        <li><a routerLink="/" fragment="mission" (click)="closeMenu()">Mission &amp; Vision</a></li>
        <li><a routerLink="/" fragment="why-us" (click)="closeMenu()">Why Choose Us</a></li>
      </ul>
    </li>

    <li class="dropdown"
        (mouseenter)="openDropdown('products')"
        (mouseleave)="closeDropdown()">
      <button type="button" class="dropdown-toggle"
              [attr.aria-expanded]="activeDropdown === 'products'"
              (click)="toggleDropdown('products', $event)">
        Products <small [class.rotate]="activeDropdown === 'products'">▾</small>
      </button>
      <ul class="dropdown-menu products-menu" *ngIf="activeDropdown === 'products'">
        <li><a routerLink="/products" (click)="closeMenu()"><strong>All Products</strong></a></li>
        <li *ngFor="let cat of categories">
          <a routerLink="/products" [queryParams]="{ category: cat.id }" (click)="closeMenu()">{{ cat.name }}</a>
        </li>
      </ul>
    </li>

    <li><a routerLink="/" fragment="testimonials" (click)="closeMenu()">Testimonials</a></li>
    <li><a routerLink="/" fragment="contact" (click)="closeMenu()">Contact</a></li>
  </ul>

  <!-- Desktop right section -->
  <div class="desktop-contact-section">
    <a href="tel:+918905302210" class="phone-link">
      <span class="phone-icon">📞</span>
      <span>+91 8905302210</span>
    </a>
    <button type="button" class="brochure-btn" (click)="downloadBrochure()">
      <span class="pdf-icon">📄</span>
      Download Brochure
    </button>
  </div>

  <!-- Mobile right section: call + download + hamburger -->
  <div class="mobile-actions">
    <a href="tel:+918905302210" class="mobile-phone-link" aria-label="Call +91 8905302210">
      <span class="phone-icon">📞</span>
      <span class="phone-number">+91 8905302210</span>
    </a>
    <button type="button" class="mobile-brochure-btn" (click)="downloadBrochure()" aria-label="Download brochure">
      <span class="pdf-icon">📄</span>
      <span class="btn-text">Brochure</span>
    </button>
    <button type="button" class="hamburger" (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen" aria-controls="main-menu"
            [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'">
      <span>{{ menuOpen ? '✕' : '☰' }}</span>
    </button>
  </div>

</nav>

<!-- Tap outside to close the mobile menu -->
<div class="menu-backdrop" *ngIf="menuOpen" (click)="closeMenu()"></div>
