  <section id="ai-panel" class="ai-panel" *ngIf="open" role="dialog" aria-label="Nexus Solutions AI assistant">
    <header class="ai-header">
      <div>
        <strong>Nexus AI Assistant</strong>
        <small>Product guidance · replies in seconds</small>
      </div>
      <button type="button" class="ai-close" (click)="close()" aria-label="Close">✕</button>
    </header>

    <div class="ai-messages" #scrollArea aria-live="polite">
      <div class="msg assistant">{{ welcome }}</div>

      <div class="ai-suggestions" *ngIf="!messages.length">
        <button type="button" *ngFor="let s of suggestions" (click)="send(s)">{{ s }}</button>
      </div>

      <div *ngFor="let m of messages" class="msg" [class.user]="m.role === 'user'" [class.assistant]="m.role === 'assistant'">{{ m.content }}</div>

      <div class="msg assistant typing" *ngIf="loading" aria-label="Assistant is typing">
        <span></span><span></span><span></span>
      </div>

      <div class="ai-error" *ngIf="error">{{ error }}</div>
    </div>

    <button type="button" class="ai-handoff" *ngIf="messages.length" (click)="continueOnWhatsApp()">
      Get a quotation on WhatsApp →
    </button>

    <form class="ai-input" (ngSubmit)="send()">
      <textarea #chatInput name="draft" rows="1" [(ngModel)]="draft" (keydown)="onKeydown($event)"
                [attr.maxlength]="maxInput" placeholder="Ask about earthing, arresters, cables…"
                aria-label="Your question"></textarea>
      <button type="submit" [disabled]="loading || !draft.trim()" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg>
      </button>
    </form>
    <p class="ai-disclaimer">AI answers can be wrong. Our engineers confirm every quotation.</p>
  </section>
</ng-container>
